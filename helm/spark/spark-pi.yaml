apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: spark-apps # Must match the namespace in SparkApplication
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: spark-apps
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "create", "delete", "list", "watch", "update"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: spark-apps
subjects:
- kind: ServiceAccount
  name: spark
  namespace: spark-apps
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io