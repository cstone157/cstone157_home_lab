apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: default
spec:
  type: Scala # Python # 
  mode: cluster
  image: "apache/spark:latest" # "apache/spark:4.3.0" # 
  imagePullPolicy: Always
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: "local:///opt/spark/examples/jars/spark-examples_2.12-3.4.1.jar"
  sparkVersion: "3.4.1"
  restartPolicy:
    type: Never
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.4.1
    serviceAccount: spark # Uses the account we created in Step 1
  executor:
    cores: 1
    instances: 2 # Number of executors
    memory: "512m"
    labels:
      version: 3.4.1