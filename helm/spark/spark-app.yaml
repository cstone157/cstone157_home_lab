apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-example
  namespace: spark-apps # Replace with your desired namespace
spec:
  type: Scala
  mode: cluster
  image: "gcr.io/spark-operator/spark:v3.1.1" # Use a Spark image with your desired version
  imagePullPolicy: Always
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: "local:///opt/spark/examples/jars/spark-examples_2.12-3.1.1.jar" # Path to Spark examples JAR
  sparkVersion: "3.1.1"
  #hadoopVersion: "3.2.0" ## Throwing the error : 'SparkApplication in version "v1beta2" cannot be handled as a SparkApplication: strict decoding error: unknown field "spec.hadoopVersion"'
  driver:
    cores: 1
    memory: "512m"
    labels:
      version: 3.1.1
    serviceAccount: spark # Ensure this service account exists with necessary permissions
  executor:
    cores: 1
    instances: 2
    memory: "512m"
    labels:
      version: 3.1.1
  # Optional: If you need to mount configurations or data
  # volumes:
  #   - name: spark-config-volume
  #     configMap:
  #       name: spark-defaults
  # volumeMounts:
  #   - name: spark-config-volume
  #     mountPath: "/opt/spark/conf/spark-defaults.conf"
  #     subPath: spark-defaults.conf