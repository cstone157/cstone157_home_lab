{{- $object := .Values.postgres -}}
{{- $_ := set $object "version" .Values.version -}}
{{- if not $object.namespace -}}
  {{- $_ := set $object "namespace" .Values.namespace -}}
{{- end }}
apiVersion: v1
kind: Service
{{- template "labchart.metadata" $object }}
spec:
  selector:
    app: {{ coalesce $object.labels.app .name "unknown" }}
  ports:
  - name: postgres
    port: {{ $object.service.port }}
    targetPort: {{ $object.service.port }}
  type: ClusterIP
