#       storage: {{ $object.volume.size }}  
#   storageClassName: {{ .Values.Lab.persistent_volume.storage_class_name }} 
#   volumeMode: Filesystem
#   volumeName: rstudio-local-pv
---
kind: Service
apiVersion: v1
metadata:
  name: rstudio-server
spec:
  type: NodePort
  selector:
    app: rstudio
  ports:
  - protocol: TCP
    nodePort: 30000
    port: 8787
