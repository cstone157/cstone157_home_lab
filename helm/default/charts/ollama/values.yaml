# ------------------------------------------------------------------------------
# Ollama :
# ------------------------------------------------------------------------------
ollama:
  enabled: false
  name: ollama
  image: ollama/ollama:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  env:
    - name: PRELOAD_MODELS
      value: "mistral:7b"
    - name: OLLAMA_KEEP_ALIVE 
      value: "12h"
  service:
    - protocol: TCP
      port: 11434
      targetPort: 11434
