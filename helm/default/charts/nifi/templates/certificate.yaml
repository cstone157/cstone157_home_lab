apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: home-lab
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nifi-tls
  namespace: home-lab
spec:
  secretName: nifi-tls  # Name of the Kubernetes Secret where the certificate will be stored
  issuerRef:
    name: selfsigned-issuer # Or your ClusterIssuer/Issuer name
    kind: Issuer # Or Issuer
    group: cert-manager.io
  dnsNames:
    - home.lab.lan  # Replace with your hostname/FQDN