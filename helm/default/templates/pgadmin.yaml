
{{/*
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pgadmin
spec:
  selector:
    matchLabels:
      app: pgadmin
  replicas: {{ .replicaCount }}
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: {{ .Values.Lab.PgAdmin.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.Lab.PgAdmin.HttpPort.port }}
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          value:  {{ quote .Values.Lab.PgAdmin.env.email }}
        - name: PGADMIN_DEFAULT_PASSWORD
          value: {{ quote .Values.Lab.PgAdmin.env.password }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin-ingress
spec:
  rules:
  - host: open-webui.minikube.local
    http:
      paths:
      - path: /pgadmin
        pathType: Prefix
        backend:
          service:
            name: open-webui-service
            port:
              number: 30010
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pgadmin
spec:
  selector:
    app: pgadmin
  ports:
  - name: {{ .Values.Lab.PgAdmin.HttpPort.name }}
    port: {{ .Values.Lab.PgAdmin.HttpPort.port }}
    targetPort: {{ .Values.Lab.PgAdmin.HttpPort.targetPort }}
    nodePort: {{ .Values.Lab.PgAdmin.HttpPort.nodePort }}
  type: NodePort
*/}}