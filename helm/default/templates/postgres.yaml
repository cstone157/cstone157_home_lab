{{- if .Values.postgres }}
{{- $object := .Values.postgres -}}
{{- $_ := set $object "version" .Values.version -}}
{{- if not $object.namespace -}}
    {{- $_ := set $object "namespace" .Values.namespace -}}
{{- end }}

{{/* Add Service if they are required */}} 
{{- template "mychart.service" $object }}

{{/* Add Statefulset if they are required */}}
{{- template "mychart.statefulset" $object }}

{{/* Add PersistentVolumeClaims if they are required */}}
{{- template "mychart.persistent_volume_claim" $object }}

{{/* Add PersistentVolumes if they are required */}}
{{- template "mychart.persistent_volume" $object }}

{{/*---
apiVersion: v1
kind: Service
{{- template "mychart.metadata" $object }}
spec:
  selector:
    app: {{ coalesce $object.labels.app .name "unknown" }}
  ports:
  {{- range .service }}
  - protocol: {{ .protocol }}
    {{- if .nodePort }}
    nodePort: {{ .nodePort }}
    {{- end }}
    {{- if .port }}
    port: {{ .port }}
    {{- end }}
    {{- if .name }}
    name: {{ .name }}
    {{- end }}
    {{- if .targetPort }}
    targetPort: {{ .targetPort }}
    {{- end }}
  {{- end }}
  type: ClusterIP

---
apiVersion: apps/v1
