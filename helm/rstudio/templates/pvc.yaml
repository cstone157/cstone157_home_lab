apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.Lab.RStudio.name }}-pvc
spec:
  accessModes:
    - {{ .Values.Lab.persistent_volume.access_modes }}
  resources:
    requests:
      storage: {{ .Values.Lab.RStudio.volume.size }}  
  storageClassName: {{ .Values.Lab.persistent_volume.storage_class_name }}