
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jupyter
  labels:
    app: jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  serviceName: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      containers:
        - name: jupyter
          ports:
            - containerPort: 8888
              name: jupyter-http
              protocol: TCP
          securityContext:
            runAsUser: 1000
            runAsGroup: 100
          resources:
            requests: 
              cpu: "2000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          image: jupyter/minimal-notebook:x86_64-python-3.11.6
          command: ["start-notebook.sh"]
          args: ["--LabApp.token='password'", "--LabApp.ip='0.0.0.0'", "--LabApp.allow_root=True"]
#           command: ["start-notebook.sh"]
#           command: 
#             - /bin/bash
#               -c
#               - |
#                 start-notebook.sh jupyter lab --LabApp.token='password' --LabApp.ip='0.0.0.0' --LabApp.allow_root=True
#                 start.sh jupyter lab --LabApp.token='password' --LabApp.ip='0.0.0.0' --LabApp.allow_root=True --ServerApp.base_url='/jupyter/'
          volumeMounts:
          - mountPath: "/home/jovyan/work"
            name: local-storage
  volumeClaimTemplates:
  - metadata:
      name: local-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi


