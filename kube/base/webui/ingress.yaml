apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
spec:
  rules:
  - host: open-webui.minikube.local
    http:
      paths:
      - path: /webui
        pathType: Prefix
        backend:
          service:
            name: open-webui-service
            port:
              number: 30000