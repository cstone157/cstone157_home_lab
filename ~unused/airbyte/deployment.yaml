---
apiVersion: v1
kind: Namespace
metadata:
  name: airbyte
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbyte-web
  namespace: airbyte
  labels:
    app: airbyte
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airbyte
      component: web
  template:
    metadata:
      labels:
        app: airbyte
        component: web
    spec:
      containers:
        - name: airbyte-web
          image: airbyte/web:latest #  Consider using a specific tagged version for stability
          ports:
            - containerPort: 3000
          env:
            - name: AIRBYTE_API_URL
              value: "http://airbyte-server:8000" # Update if necessary
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-web
  namespace: airbyte
spec:
  selector:
    app: airbyte
    component: web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer # Or NodePort/ClusterIP, depending on your Kubernetes setup

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbyte-server
  namespace: airbyte
  labels:
    app: airbyte
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airbyte
      component: server
  template:
    metadata:
      labels:
        app: airbyte
        component: server
    spec:
      containers:
        - name: airbyte-server
          image: airbyte/server:latest # Consider using a specific tagged version for stability
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_USER
              value: airbyte # Update if different
            - name: DATABASE_PASSWORD
              value: airbyte # Update if different
            - name: DATABASE_HOST
              value: airbyte-db # Update if different
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: airbyte
            - name: DATABASE_SSL
              value: "false"
            #  Configure other environment variables like Temporal etc., based on your Airbyte setup.
            #  See Airbyte documentation for available configuration options
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 2
              memory: 4Gi

---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-server
  namespace: airbyte
spec:
  selector:
    app: airbyte
    component: server
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbyte-db
  namespace: airbyte
  labels:
    app: airbyte
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airbyte
      component: database
  template:
    metadata:
      labels:
        app: airbyte
        component: database
    spec:
      containers:
        - name: airbyte-db
          image: postgres:13 # Consider a specific postgres version
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: airbyte
            - name: POSTGRES_PASSWORD
              value: airbyte
            - name: POSTGRES_DB
              value: airbyte
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
      volumes:
        - name: db-data
          emptyDir: {}  #  Replace with PersistentVolumeClaim for persistent storage

---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-db
  namespace: airbyte
spec:
  selector:
    app: airbyte
    component: database
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP