apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Chart.Name }}-ingress
  namespace: {{ .Chart.Name }}
  labels:
    date: {{ now | htmlDate }}
    version: {{ .Chart.Version | quote }}
    app: {{ .Chart.Name }}
spec:
  dnsNames:
  - registry.tmdash2.lab.shocn.lan
  issuerRef:
    group: adcs.certmanager.csf.nokia.com
    kind: ClusterAdcsIssuer
    name: adcs-cluster-issuer
  renewBefore: 48h0m0s
  secretName: {{ .Chart.Name }}-tls-ingress
  usages:
  - digital signature
  - key encipherment