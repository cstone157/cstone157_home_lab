---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
  namespace: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    date: {{ now | htmlDate }}
    version: {{ .Chart.Version | quote }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-certificate
  namespace: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    date: {{ now | htmlDate }}
    version: {{ .Chart.Version | quote }}
spec:
  secretName: registry-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: registry.example.com # Change this to your registry domain
  dnsNames:
    - registry.example.com       # Change this to your registry domain
  privateKey:                     # Add this section to explicitly control key rotation
    rotationPolicy: Always #or Never.  Omit to use the default behavior.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    date: {{ now | htmlDate }}
    version: {{ .Chart.Version | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      volumes:
        - name: registry-data
          emptyDir: {}  # Use a persistent volume in production!
        - name: tls-certs
          secret:
            secretName: registry-tls
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          env:
            - name: REGISTRY_HTTP_ADDR
              value: :5000
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
          livenessProbe:
            httpGet:
              path: /
              port: 5000
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    date: {{ now | htmlDate }}
    version: {{ .Chart.Version | quote }}
spec:
  type: NodePort # Or ClusterIP if you only want internal access
  selector:
    app: registry
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30000 # Optional, if using NodePort.  Choose an available port.

# Optional Ingress (if you want a stable domain and TLS termination)
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-ingress
  namespace: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    date: {{ now | htmlDate }}
    version: {{ .Chart.Version | quote }}
#   annotations:
#     kubernetes.io/ingress.class: "nginx"  # Replace with your Ingress controller
spec:
  ingressClassName: "nginx" # specify ingress controller
  tls:
    - hosts:
        - registry.example.com    # Your registry domain
      secretName: registry-tls    # The secret generated by cert-manager
  rules:
    - host: registry.example.com  # Your registry domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 30000