apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-website-cert
  namespace: default # Replace with the namespace of your Ingress
spec:
  secretName: my-website-tls
  dnsNames:
    - mywebsite.example.com # Replace with your domain
    - www.mywebsite.example.com # Replace with your domain
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer