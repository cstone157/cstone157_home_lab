apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-website-ingress
  namespace: default # Replace with the namespace where you created the Certificate
spec:
  ingressClassName: nginx # Replace with your ingress controller class
  tls:
  - hosts:
    - mywebsite.example.com # Replace with your domain
    - www.mywebsite.example.com # Replace with your domain
    secretName: my-website-tls  # This MUST match the secretName in your Certificate resource
  rules:
  - host: mywebsite.example.com # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-website-service  # Replace with your service name
            port:
              number: 80
  - host: www.mywebsite.example.com # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-website-service # Replace with your service name
            port:
              number: 80